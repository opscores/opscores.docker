---
# Configure Prometheus integration for docker_monitoring role

- name: Create Prometheus configuration directory
  ansible.builtin.file:
    path: "{{ docker_monitoring_prometheus_config_path }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: true

- name: Create Prometheus targets configuration for cAdvisor
  ansible.builtin.copy:
    content: |
      - targets:
        - localhost:{{ docker_monitoring_cadvisor_port }}
        labels:
          job: cadvisor
    dest: "{{ docker_monitoring_prometheus_config_path }}/cadvisor.yml"
    mode: '0644'
    owner: root
    group: root
  when: docker_monitoring_install_cadvisor
  become: true

- name: Create Prometheus targets configuration for node_exporter
  ansible.builtin.copy:
    content: |
      - targets:
        - localhost:{{ docker_monitoring_node_exporter_port }}
        labels:
          job: node_exporter
    dest: "{{ docker_monitoring_prometheus_config_path }}/node_exporter.yml"
    mode: '0644'
    owner: root
    group: root
  when: docker_monitoring_install_node_exporter
  become: true

- name: Create Prometheus configuration for Docker daemon metrics
  ansible.builtin.copy:
    content: |
      - targets:
        - localhost:{{ docker_monitoring_docker_daemon_metrics_port }}
        labels:
          job: docker_daemon
    dest: "{{ docker_monitoring_prometheus_config_path }}/docker_daemon.yml"
    mode: '0644'
    owner: root
    group: root
  when: docker_monitoring_install_docker_daemon_metrics
  become: true

- name: Print Prometheus configuration status
  ansible.builtin.debug:
    msg: "Prometheus configuration files created in {{ docker_monitoring_prometheus_config_path }}"
