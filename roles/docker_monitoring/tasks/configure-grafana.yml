---
# Configure Grafana dashboards for docker_monitoring role

- name: Create Grafana dashboards directory
  ansible.builtin.file:
    path: "{{ docker_monitoring_grafana_dashboards_path }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: true

- name: Create Docker Overview dashboard
  ansible.builtin.copy:
    content: |
      {
        "annotations": {
          "list": []
        },
        "editable": true,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 0,
        "id": null,
        "links": [],
        "liveNow": false,
        "panels": [
          {
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "custom": {"lineWidth": 1},
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "red", "value": 80}
                  ]
                }
              },
              "overrides": []
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "id": 1,
            "options": {
              "legend": {"calcs": [], "displayMode": "list", "placement": "bottom"},
              "tooltip": {"mode": "single"}
            },
            "targets": [
              {
                "expr": "container_last_seen{name!=\"\"}",
                "legendFormat": "{% raw %}{{name}}{% endraw %}",
                "refId": "A"
              }
            ],
            "title": "Container Count",
            "type": "timeseries"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null}
                  ]
                }
              },
              "overrides": []
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "id": 2,
            "options": {
              "orientation": "auto",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "showThresholdLabels": false,
              "showThresholdMarkers": true
            },
            "pluginVersion": "9.0.0",
            "targets": [
              {
                "expr": "node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes",
                "legendFormat": "Used",
                "refId": "A"
              },
              {
                "expr": "node_memory_MemAvailable_bytes",
                "legendFormat": "Available",
                "refId": "B"
              }
            ],
            "title": "Memory Usage",
            "type": "gauge"
          }
        ],
        "refresh": "10s",
        "schemaVersion": 38,
        "style": "dark",
        "tags": ["docker", "monitoring"],
        "templating": {
          "list": [
            {
              "current": {"selected": false, "text": "Prometheus", "value": "Prometheus"},
              "hide": 0,
              "includeAll": false,
              "label": "Data Source",
              "name": "DS_PROMETHEUS",
              "options": [],
              "query": "prometheus",
              "refresh": 1,
              "regex": "",
              "type": "datasource"
            }
          ]
        },
        "time": {"from": "now-6h", "to": "now"},
        "timepicker": {},
        "timezone": "",
        "title": "Docker Overview",
        "uid": "docker-overview",
        "version": 1,
        "weekStart": ""
      }
    dest: "{{ docker_monitoring_grafana_dashboards_path }}/docker-overview.json"
    mode: '0644'
    owner: root
    group: root
  become: true

- name: Create cAdvisor metrics dashboard
  ansible.builtin.copy:
    content: |
      {
        "annotations": {"list": []},
        "editable": true,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 0,
        "id": null,
        "links": [],
        "liveNow": false,
        "panels": [
          {
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "custom": {"lineWidth": 1},
                "mappings": [],
                "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
              },
              "overrides": []
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "id": 1,
            "options": {
              "legend": {"calcs": [], "displayMode": "list", "placement": "bottom"},
              "tooltip": {"mode": "single"}
            },
            "targets": [
              {"expr": "rate(container_cpu_usage_seconds_total[5m])", "legendFormat": "{% raw %}{{name}}{% endraw %}", "refId": "A"}
            ],
            "title": "CPU Usage by Container",
            "type": "timeseries"
          },
          {
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "custom": {"lineWidth": 1},
                "mappings": [],
                "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
              },
              "overrides": []
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "id": 2,
            "options": {
              "legend": {"calcs": [], "displayMode": "list", "placement": "bottom"},
              "tooltip": {"mode": "single"}
            },
            "targets": [
              {"expr": "container_memory_usage_bytes", "legendFormat": "{% raw %}{{name}}{% endraw %}", "refId": "A"}
            ],
            "title": "Memory Usage by Container",
            "type": "timeseries"
          }
        ],
        "refresh": "10s",
        "schemaVersion": 38,
        "style": "dark",
        "tags": ["docker", "cadvisor"],
        "templating": {
          "list": [
            {
              "current": {"selected": false, "text": "Prometheus", "value": "Prometheus"},
              "hide": 0,
              "includeAll": false,
              "label": "Data Source",
              "name": "DS_PROMETHEUS",
              "options": [],
              "query": "prometheus",
              "refresh": 1,
              "regex": "",
              "type": "datasource"
            }
          ]
        },
        "time": {"from": "now-6h", "to": "now"},
        "timepicker": {},
        "timezone": "",
        "title": "cAdvisor Metrics",
        "uid": "cadvisor-metrics",
        "version": 1,
        "weekStart": ""
      }
    dest: "{{ docker_monitoring_grafana_dashboards_path }}/cadvisor-metrics.json"
    mode: '0644'
    owner: root
    group: root
  become: true

- name: Create Node Exporter dashboard
  ansible.builtin.copy:
    content: |
      {
        "annotations": {"list": []},
        "editable": true,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 0,
        "id": null,
        "links": [],
        "liveNow": false,
        "panels": [
          {
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "custom": {"lineWidth": 1},
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "yellow", "value": 70},
                    {"color": "red", "value": 90}
                  ]
                }
              },
              "overrides": []
            },
            "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
            "id": 1,
            "options": {
              "orientation": "auto",
              "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
              "showThresholdLabels": false,
              "showThresholdMarkers": true
            },
            "pluginVersion": "9.0.0",
            "targets": [
              {"expr": "100 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100)", "legendFormat": "Memory Usage %", "refId": "A"}
            ],
            "title": "Memory Usage %",
            "type": "gauge"
          },
          {
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "custom": {"lineWidth": 1},
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "yellow", "value": 70},
                    {"color": "red", "value": 90}
                  ]
                }
              },
              "overrides": []
            },
            "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
            "id": 2,
            "options": {
              "orientation": "auto",
              "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
              "showThresholdLabels": false,
              "showThresholdMarkers": true
            },
            "pluginVersion": "9.0.0",
            "targets": [
              {
                "expr": "100 - (node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"} * 100)",
                "legendFormat": "Disk Usage %",
                "refId": "A"
              }
            ],
            "title": "Disk Usage %",
            "type": "gauge"
          },
          {
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "custom": {"lineWidth": 1},
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "yellow", "value": 70},
                    {"color": "red", "value": 90}
                  ]
                }
              },
              "overrides": []
            },
            "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
            "id": 3,
            "options": {
              "orientation": "auto",
              "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
              "showThresholdLabels": false,
              "showThresholdMarkers": true
            },
            "pluginVersion": "9.0.0",
            "targets": [
              {"expr": "100 - (avg(irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "CPU Usage %", "refId": "A"}
            ],
            "title": "CPU Usage %",
            "type": "gauge"
          }
        ],
        "refresh": "10s",
        "schemaVersion": 38,
        "style": "dark",
        "tags": ["docker", "node-exporter"],
        "templating": {
          "list": [
            {
              "current": {"selected": false, "text": "Prometheus", "value": "Prometheus"},
              "hide": 0,
              "includeAll": false,
              "label": "Data Source",
              "name": "DS_PROMETHEUS",
              "options": [],
              "query": "prometheus",
              "refresh": 1,
              "regex": "",
              "type": "datasource"
            }
          ]
        },
        "time": {"from": "now-6h", "to": "now"},
        "timepicker": {},
        "timezone": "",
        "title": "Node Exporter",
        "uid": "node-exporter",
        "version": 1,
        "weekStart": ""
      }
    dest: "{{ docker_monitoring_grafana_dashboards_path }}/node-exporter.json"
    mode: '0644'
    owner: root
    group: root
  become: true

- name: Print Grafana dashboards configuration status
  ansible.builtin.debug:
    msg: "Grafana dashboard files created in {{ docker_monitoring_grafana_dashboards_path }}"
