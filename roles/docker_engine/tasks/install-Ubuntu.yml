---
# Install Docker Engine for Ubuntu

- name: Include Ubuntu-specific variables
  ansible.builtin.include_vars: Ubuntu.yml
  tags: [always]

- name: Install Docker Engine packages
  ansible.builtin.apt:
    name: "{{ docker_ubuntu_packages }}"
    state: present
    allow_downgrade: "{{ docker_engine_version != '' }}"
  register: docker_install_result
  become: true
  notify: Ensure Docker service state

- name: Flush handlers to apply Docker service state
  ansible.builtin.meta: flush_handlers

- name: Check if Docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
  check_mode: true
  register: docker_service_check
  become: true
  when: docker_engine_service_state != "stopped"

- name: Ensure Docker service is running if it should be
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: "{{ docker_engine_service_enabled }}"
  become: true
  when:
    - docker_engine_service_state != "stopped"
    - docker_service_check is changed or docker_install_result is changed

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false
  become: true

- name: Print Docker version
  ansible.builtin.debug:
    msg: "Docker version: {{ docker_version.stdout }}"
