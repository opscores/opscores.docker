---
# Install Docker repository for Rocky Linux

- name: Include Rocky-specific variables
  ansible.builtin.include_vars: Rocky.yml
  tags: [always]

- name: Set base URL for Docker repository
  ansible.builtin.set_fact:
    docker_repo_base_url: "{{ docker_repository_base_url if docker_repository_base_url else 'https://download.docker.com' }}"
  when: docker_repository_manage_repo

- name: Set distro code for Rocky
  ansible.builtin.set_fact:
    docker_distro_code: "rhel"
  when: docker_repository_manage_repo

- name: Install dnf-plugins-core for Rocky systems
  ansible.builtin.package:
    name: "{{ docker_rocky_repo_deps }}"
    state: present
  when: docker_repository_manage_repo

- name: Remove legacy Docker repository files
  ansible.builtin.find:
    paths: /etc/yum.repos.d
    patterns: "docker-ce-*.repo"
    file_type: file
  register: legacy_docker_repos
  when: docker_repository_manage_repo

- name: Delete legacy Docker repository files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ legacy_docker_repos.files | map(attribute='path') | list }}"
  when: docker_repository_manage_repo

- name: Create Docker repository file for Rocky
  ansible.builtin.copy:
    content: |
      [docker-ce-{{ docker_repository_channel }}]
      name=Docker CE {{ docker_repository_channel }} - $basearch
      baseurl={{ docker_repo_base_url }}/linux/{{ docker_distro_code }}/$releasever/$basearch/{{ docker_repository_channel }}
      enabled=1
      gpgcheck=1
      gpgkey={{ docker_repo_base_url }}/linux/{{ docker_distro_code }}/gpg
    dest: "/etc/yum.repos.d/docker-ce.repo"
    mode: '0644'
    owner: root
    group: root
  become: true
  when: docker_repository_manage_repo

- name: Update repository cache
  ansible.builtin.dnf:
    update_cache: true
  when: docker_repository_manage_repo
