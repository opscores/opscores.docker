---
# Preflight checks for docker_prerequisites role

# Check minimum RAM requirement
- name: Check minimum RAM requirement
  ansible.builtin.fail:
    msg: "System does not meet minimum RAM requirement of {{ docker_prerequisites_min_ram_mb }} MB. Available: {{ ansible_memtotal_mb }} MB"
  when: ansible_memtotal_mb < docker_prerequisites_min_ram_mb

# Check architecture (assuming x86-64 as per spec)
- name: Check if architecture is x86-64
  ansible.builtin.fail:
    msg: "Unsupported architecture: {{ ansible_architecture }}. Only x86-64 is supported."
  when: ansible_architecture != 'x86_64'
