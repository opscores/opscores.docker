---
# Verify Docker service status

- name: Check if Docker service is active
  ansible.builtin.command: systemctl is-active docker
  register: docker_service_active
  changed_when: false
  become: true
  failed_when: false

- name: Check if Docker service is enabled
  ansible.builtin.command: systemctl is-enabled docker
  register: docker_service_enabled
  changed_when: false
  become: true
  failed_when: false

- name: Ensure Docker service is started
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  become: true
  register: docker_service_status
  when: docker_service_active.rc != 0

- name: Print Docker service status
  ansible.builtin.debug:
    msg: "Docker service is running and enabled"
  when: docker_service_active.rc == 0 and docker_service_enabled.rc == 0

- name: Fail if Docker service is not running
  ansible.builtin.fail:
    msg: "Docker service is not running"
  when: docker_service_active.rc != 0

- name: Fail if Docker service is not enabled
  ansible.builtin.fail:
    msg: "Docker service is not enabled"
  when: docker_service_enabled.rc != 0
