---
# Verify basic Docker commands

- name: Check Docker version
  ansible.builtin.command: docker version
  register: docker_version_result
  changed_when: false
  become: true

- name: Print Docker version
  ansible.builtin.debug:
    msg: "Docker version: {{ docker_version_result.stdout_lines }}"
  when: docker_version_result is succeeded

- name: Check Docker info
  ansible.builtin.command: docker info
  register: docker_info_result
  changed_when: false
  become: true

- name: Print Docker info (first 10 lines)
  ansible.builtin.debug:
    msg: "Docker info (first 10 lines): {{ docker_info_result.stdout_lines[:10] }}"
  when: docker_info_result is succeeded

- name: Fail if Docker version command failed
  ansible.builtin.fail:
    msg: "Docker version command failed"
  when: docker_version_result is failed

- name: Fail if Docker info command failed
  ansible.builtin.fail:
    msg: "Docker info command failed"
  when: docker_info_result is failed
