---
# Playbook: validate-docker-installation.yml
# Purpose: Idempotent verification of the current Docker installation.

- name: Verify installed Docker
  hosts: docker_hosts
  become: true
  vars:
    docker_verification_run_hello_world: true
    docker_verification_remove_hello_world_image: true
  roles:
    - role: opscores.docker.docker_verification
